apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-deployment-sep28
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: reg00sep28.azurecr.io/my-vk-custom-app:v1
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: web-app-service-sep28
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: web-app
